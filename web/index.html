<!doctype html>
<html lang="__LANG__"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="__SITE_DESCRIPTION__">
<title>__SITE_TITLE__</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23FF4F00' d='M0 0h32v32H0z'/%3E%3Cpath fill='%23111' d='M9 7h14v4h-5v10h5v4H9v-4h5V11H9z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css"><script type="module" src="./app.js"></script>
</head><body>
<main class="board" id="board"></main>
<dialog id="drawer" class="drawer" aria-labelledby="drawer-title">
<div class="dialog-top"><button type="button" class="icon-button" data-close="drawer" aria-label="__I18N_closeArchive__">×</button></div>
<h2 id="drawer-title">__I18N_archiveTitle__</h2><p class="drawer-intro">__I18N_archiveIntro__</p><div id="discarded-list"></div>
</dialog>
<aside id="chat-link-editor" class="chat-link-editor" popover="auto" role="dialog" aria-labelledby="chat-link-title">
<form id="chat-link-form" novalidate>
<div class="dialog-top"><h2 id="chat-link-title">__I18N_linkTitle__</h2><button type="button" class="icon-button" id="close-chat-link" aria-label="__I18N_closeLink__">×</button></div>
<p class="chat-link-project" id="chat-link-project"></p>
<label for="chat-link-url">__I18N_chatURL__</label>
<input id="chat-link-url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="2000" placeholder="https://chatgpt.com/c/…" aria-describedby="chat-link-help chat-link-error">
<p class="chat-link-help" id="chat-link-help">__I18N_chatHelp__</p>
<p class="chat-link-error" id="chat-link-error" role="alert" hidden></p>
<div class="chat-link-actions"><button type="button" id="remove-chat-link" class="remove-chat-link" hidden>__I18N_removeLink__</button><button type="submit" id="save-chat-link" class="save-chat-link">__I18N_saveLink__</button></div>
</form>
</aside>
