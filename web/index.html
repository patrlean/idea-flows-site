<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="__SITE_DESCRIPTION__">
<title>__SITE_TITLE__</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23FF4F00' d='M0 0h32v32H0z'/%3E%3Cpath fill='%23111' d='M9 7h14v4h-5v10h5v4H9v-4h5V11H9z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles.css"><script type="module" src="./app.js"></script>
</head><body>
<main class="board" id="board"></main>
<dialog id="drawer" class="drawer" aria-labelledby="drawer-title">
<div class="dialog-top"><button type="button" class="icon-button" data-close="drawer" aria-label="关闭归档抽屉">×</button></div>
<h2 id="drawer-title">已归档的想法</h2><p class="drawer-intro">暂时放下，也保留来过的痕迹。可以直接恢复，或在 Codex 中继续。</p><div id="discarded-list"></div>
</dialog>
<aside id="chat-link-editor" class="chat-link-editor" popover="auto" role="dialog" aria-labelledby="chat-link-title">
<form id="chat-link-form" novalidate>
<div class="dialog-top"><h2 id="chat-link-title">关联 ChatGPT 对话</h2><button type="button" class="icon-button" id="close-chat-link" aria-label="关闭对话关联">×</button></div>
<p class="chat-link-project" id="chat-link-project"></p>
<label for="chat-link-url">对话链接</label>
<input id="chat-link-url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="2000" placeholder="https://chatgpt.com/c/…" aria-describedby="chat-link-help chat-link-error">
<p class="chat-link-help" id="chat-link-help">从 ChatGPT 地址栏复制对话链接并粘贴。</p>
<p class="chat-link-error" id="chat-link-error" role="alert" hidden></p>
<div class="chat-link-actions"><button type="button" id="remove-chat-link" class="remove-chat-link" hidden>移除关联</button><button type="submit" id="save-chat-link" class="save-chat-link">保存关联</button></div>
</form>
</aside>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body></html>
